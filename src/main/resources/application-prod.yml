# Production Profile - MySQL or PostgreSQL (Render)
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mamampoki}?useSSL=false&serverTimezone=Africa/Dar_es_Salaam&characterEncoding=UTF-8}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:${spring.datasource.username:}}
    password: ${DB_PASSWORD:${spring.datasource.password:}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

# JWT (from environment variables)
app:
  jwt:
    secret: ${JWT_SECRET}

# CORS (production)
cors:
  allowed-origins: ${FRONTEND_URL:https://mamampoki.co.tz}

# Actuator (production)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Logging (production)
logging:
  level:
    root: WARN
    com.mamampoki: INFO
    org.springframework.security: WARN
