# Production Profile - MySQL Database
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mamampoki}?useSSL=true&requireSSL=true&serverTimezone=Africa/Dar_es_Salaam&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true

# JWT (from environment variables)
app:
  jwt:
    secret: ${JWT_SECRET}

# CORS (production)
cors:
  allowed-origins: ${FRONTEND_URL:https://mamampoki.co.tz}

# Actuator (production)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Logging (production)
logging:
  level:
    root: WARN
    com.mamampoki: INFO
    org.springframework.security: WARN
