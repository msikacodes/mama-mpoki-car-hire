# Development Profile - H2 Database with Hibernate schema generation
spring:
  datasource:
    url: jdbc:h2:mem:mamampoki;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Flyway for dev - use Hibernate schema generation
  flyway:
    enabled: false

# Seed data for development
app:
  jwt:
    secret: mama-mpoki-dev-secret-key-must-be-at-least-256-bits-long-for-hs512

# CORS (development)
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
