services:
  # Spring Boot Backend
  - type: web
    name: mama-mpoki-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: mama-mpoki-db
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # React Frontend
  - type: web
    name: mama-mpoki-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: mama-mpoki-api
          type: web
          property: host

databases:
  - name: mama-mpoki-db
    plan: free
    databaseName: mamampoki
